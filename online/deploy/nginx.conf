# AuxiOffice Online derrière nginx (HTTPS) — /etc/nginx/sites-available/web.office.auxinux.ca
server {
    listen 443 ssl;
    http2 on;
    server_name web.office.auxinux.ca;

    ssl_certificate     /etc/letsencrypt/live/web.office.auxinux.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.office.auxinux.ca/privkey.pem;

    # Documents envoyés (doit suivre --max-open-mb du serveur).
    client_max_body_size 200m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # AuxiMail (AuxiMailWeb, 127.0.0.1:8095) sous /mail/. Recommandé : le relais
    # intégré (auxi-online --auximail-proxy http://127.0.0.1:8095) et retirer ces
    # deux blocs. Sinon, ils reprennent web/deploy/nginx-auxioffice.conf du dépôt
    # AuxiMail et doivent rester AVANT « location / ».
    location = /mail/api/events {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /mail {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
        client_max_body_size 60m;
        gzip on;
        gzip_types application/javascript text/css image/svg+xml application/json;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Le client envoie un signe de vie toutes les 25 s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        gzip on;
        gzip_types application/javascript text/css application/wasm image/svg+xml application/json;
    }
}

server {
    listen 80;
    server_name web.office.auxinux.ca;
    return 301 https://$host$request_uri;
}
