# Intégration continue d'AuxiOffice : compilation et tests sur les machines
# virtuelles de GitHub (Linux, macOS, Windows). Aucun paquet n'est construit
# ici : les paquets sont faits sur chaque système par l'équipe.
#
# Linux (x86_64 et ARM64) et Windows : tests complets, y compris ceux du
# moteur avec le vrai LibreOffice (scripts/fetch-engine.sh). macOS : compilation et tests sans
# moteur (le moteur macOS se compile en 1 à 3 h).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux x86_64 (tests complets)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Paquets système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev \
            libxml2-utils python3-pip fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
          python3 -m pip install --user --break-system-packages python-docx openpyxl python-pptx Pillow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache du moteur LibreOffice
        uses: actions/cache@v4
        with:
          path: .engine/cache
          key: lo-${{ runner.os }}-${{ hashFiles('engine/libreoffice.lock.json') }}
      - name: Moteur LibreOffice
        run: scripts/fetch-engine.sh
      - name: Interfaces (npm)
        run: scripts/ci-npm.sh
      - name: Tests
        run: PYTHON=python3 scripts/test.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Compilation de production
        run: cargo build --release --workspace --features auxioffice/custom-protocol

  linux-arm64:
    name: Linux ARM64 (tests complets)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Paquets système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev \
            libxml2-utils python3-pip fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
          python3 -m pip install --user --break-system-packages python-docx openpyxl python-pptx Pillow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache du moteur LibreOffice
        uses: actions/cache@v4
        with:
          path: .engine/cache
          key: lo-${{ runner.os }}-${{ hashFiles('engine/libreoffice.lock.json') }}
      - name: Moteur LibreOffice
        run: scripts/fetch-engine.sh
      - name: Interfaces (npm)
        run: scripts/ci-npm.sh
      - name: Tests
        run: PYTHON=python3 scripts/test.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Compilation de production
        run: cargo build --release --workspace --features auxioffice/custom-protocol

  windows:
    name: Windows x86_64 (tests complets)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache du moteur LibreOffice
        uses: actions/cache@v4
        with:
          path: .engine/cache
          key: lo-${{ runner.os }}-${{ hashFiles('engine/libreoffice.lock.json') }}
      - name: Moteur LibreOffice
        run: PYTHON=python scripts/fetch-engine.sh
      - name: Modules Python des documents de test
        run: python -m pip install python-docx openpyxl python-pptx Pillow
      - name: Interfaces (npm)
        run: scripts/ci-npm.sh
      - name: Tests
        run: PYTHON=python scripts/test.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Compilation de production
        run: cargo build --release --workspace --features auxioffice/custom-protocol
      - name: Installation Windows 11 (install-apps.sh) et lancement d'AuxiWriter
        run: |
          scripts/install-apps.sh
          P="$(cygpath -u "$LOCALAPPDATA")/Programs"
          M="$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs"
          test -f "$P/AuxiOffice/AuxiWriter.exe"
          test -f "$P/AuxiOffice/engine/program/soffice.exe"
          test -f "$P/AuxiText/AuxiText.exe"
          test -f "$M/AuxiOffice/AuxiWriter.lnk"
          test -f "$M/AuxiText.lnk"
          reg query 'HKCU\Software\Classes\.docx\OpenWithProgids' | grep -q AuxiOffice.AuxiWriter
          "$P/AuxiOffice/AuxiWriter.exe" "$(cygpath -w target/fixtures/rapport.docx)" &
          sleep 90
          tasklist | grep -i -E "auxi|soffice" || true
          tasklist | grep -qi "auxi-engine.exe"
          D="$(cygpath -u "$APPDATA")/ca.auxinux.office"
          cat "$D/moteur.log" "$D/interface.log" 2>/dev/null | tail -30 || true
          ! grep -qi "erreur\|error" "$D/interface.log" 2>/dev/null
      - name: Exécutables (build-win.sh) et installateur d'AuxiText
        # Indépendant des tests : s'exécute même si une étape précédente a échoué.
        if: ${{ !cancelled() }}
        run: |
          scripts/build-win.sh
          test -f target/windows/AuxiOffice/AuxiWriter.exe
          test -f target/windows/AuxiOffice/auxi-engine.exe
          test -f target/windows/AuxiOffice/engine/program/soffice.exe
          test -f target/windows/AuxiText/AuxiText.exe
          [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup -y --no-progress
          scripts/build-win.sh --auxitext --installer
          setup=$(ls target/windows/AuxiText-*-windows-x64-setup.exe)
          "$setup" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          P="$(cygpath -u "$LOCALAPPDATA")/Programs"
          test -f "$P/AuxiText/AuxiText.exe"
          test -f "$P/AuxiText/unins000.exe"
          reg query 'HKCU\Software\Classes\.md\OpenWithProgids' | grep -q AuxiText.Document
      - name: Journaux (en cas d'échec)
        if: failure()
        run: |
          cat .engine/windows-x86_64/msiexec.log 2>/dev/null | tail -40 || true
          cat "$(cygpath -u "$APPDATA")/ca.auxinux.office/moteur.log" 2>/dev/null | tail -60 || true

  autres:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon (compilation, tests sans moteur)
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Interfaces (npm)
        run: scripts/ci-npm.sh
      - name: Tests sans moteur
        run: cargo test --workspace -- --test-threads=1
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Compilation de production
        run: cargo build --release --workspace --features auxioffice/custom-protocol
      - name: Image disque d'AuxiText (build.sh --auxitext --installer)
        run: |
          scripts/build.sh --auxitext --installer
          dmg=$(ls target/macos/AuxiText-*-macos-arm64.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          test -x "$mnt/AuxiText.app/Contents/MacOS/AuxiText"
          test -L "$mnt/Applications"
          codesign --verify --deep --verbose "$mnt/AuxiText.app"
          hdiutil detach "$mnt"

  online:
    # AuxiOffice Online : modules WebAssembly (AuxiText, AuxiSheet Lite),
    # interface web (applications du bureau reconstruites avec les shims de
    # online/web) et serveur. Détecte un changement de app/ui ou text/ui qui
    # casserait la version web.
    name: AuxiOffice Online (web et serveur)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            online/sheet-wasm
      - name: wasm-bindgen
        run: cargo install --locked wasm-bindgen-cli --version "$(sed -n 's/^wasm-bindgen = "=\(.*\)"/\1/p' online/textio-wasm/Cargo.toml)"
      - name: Construction (online/build.sh --debug)
        run: online/build.sh --debug
      - name: Tests du serveur
        run: cargo test -p auxi-online -p auxitext-textio-wasm
