# Intégration continue d'AuxiOffice : compilation et tests sur les machines
# virtuelles de GitHub (Linux, macOS, Windows). Aucun paquet n'est construit
# ici : les paquets sont faits sur chaque système par l'équipe.
#
# Linux : tests complets, y compris ceux du moteur avec le vrai LibreOffice
# (scripts/fetch-engine.sh). macOS et Windows : compilation et tests sans
# moteur (le moteur macOS se compile en 1 à 3 h ; Windows n'a pas encore le
# sien).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux x86_64 (tests complets)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Paquets système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev \
            libxml2-utils python3-pip fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
          python3 -m pip install --user --break-system-packages python-docx openpyxl python-pptx Pillow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache du moteur LibreOffice
        uses: actions/cache@v4
        with:
          path: .engine/cache
          key: lo-${{ runner.os }}-${{ hashFiles('engine/libreoffice.lock.json') }}
      - name: Moteur LibreOffice
        run: scripts/fetch-engine.sh
      - name: Interfaces (npm)
        run: scripts/ci-npm.sh
      - name: Tests
        run: PYTHON=python3 scripts/test.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Compilation de production
        run: cargo build --release --workspace --features auxioffice/custom-protocol

  autres:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon (compilation, tests sans moteur)
            os: macos-14
          - name: Windows x86_64 (compilation, tests sans moteur)
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Interfaces (npm)
        run: scripts/ci-npm.sh
      - name: Tests sans moteur
        run: cargo test --workspace -- --test-threads=1
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Compilation de production
        run: cargo build --release --workspace --features auxioffice/custom-protocol
