# Diagnostic du moteur sous Windows (lancé à la main ou sur la branche diag-*).
name: Diagnostic Windows
on:
  workflow_dispatch:
  push:
    branches: ["diag-*"]
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .engine/cache
          key: lo-${{ runner.os }}-${{ hashFiles('engine/libreoffice.lock.json') }}
      - run: PYTHON=python scripts/fetch-engine.sh
      - run: python -m pip install python-docx openpyxl python-pptx Pillow && python tests/fixtures/generate.py target/fixtures
      - run: cargo build -p auxi-engine
      - name: Classeur
        run: python .github/diag/winhang.py target/fixtures/budget.xlsx
      - name: Présentation
        run: python .github/diag/winhang.py target/fixtures/presentation.pptx
      - name: Texte
        run: python .github/diag/winhang.py target/fixtures/rapport.docx
