# Paquets Debian d'AuxiOffice et d'AuxiText (Debian 13 / AuxiNuxOS), amd64 et
# arm64, construits nativement dans un conteneur Debian 13 sur les machines
# virtuelles de GitHub (x86_64 et ARM64). Lancement manuel seulement :
# Actions → « Paquets Debian » → Run workflow. Les .deb sont joints au
# lancement (artefacts) ; leur publication dans le dépôt APT reste manuelle.
name: Paquets Debian

on:
  workflow_dispatch:
    inputs:
      paquets:
        description: "tout (auxitext, auxioffice, auxinux-office) ou auxitext seul"
        type: choice
        options: [tout, auxitext]
        default: tout

jobs:
  deb:
    name: Debian 13 ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Outils de compilation
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config python3 dpkg-dev fakeroot xz-utils \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev nodejs npm
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          node --version
      - uses: actions/checkout@v4
      - name: Moteur LibreOffice
        if: inputs.paquets == 'tout'
        run: scripts/fetch-engine.sh
      - name: Paquets
        run: |
          . "$HOME/.cargo/env"
          git config --global --add safe.directory "$PWD"
          if [ "${{ inputs.paquets }}" = auxitext ]; then scripts/build-deb.sh --auxitext; else scripts/build-deb.sh; fi
          ls -la target/deb
      - uses: actions/upload-artifact@v4
        with:
          name: paquets-${{ matrix.arch }}
          path: target/deb/*.deb
          if-no-files-found: error
