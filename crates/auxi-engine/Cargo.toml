[package]
name = "auxi-engine"
description = "Moteur documentaire d'AuxiOffice : processus séparé qui pilote LibreOfficeKit, et client pour le piloter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
lok-sys = { path = "../lok-sys" }
serde.workspace = true
serde_json.workspace = true
url = "2"
libc = "0.2"

[[bin]]
name = "auxi-engine"
path = "src/bin/auxi-engine.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

[dev-dependencies]
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
